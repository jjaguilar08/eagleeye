services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eagleeye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eagleeye_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-eagleeye}
    ports:
      - "5432:5432"
    volumes:
      - eagleeye_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eagleeye}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - eagleeye_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  eagleeye_postgres_data:
  eagleeye_redis_data:
